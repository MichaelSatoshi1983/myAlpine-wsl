name: build-alpine-wsl

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: validate shell scripts
        run: |
          sh -n scripts/build.sh
          sh -n scripts/setup.sh
          sh -n scripts/wsl-start-docker.sh
          sh -n scripts/wsl-migrate.sh
          sh -n scripts/wsl-update.sh
          shellcheck scripts/build.sh scripts/setup.sh scripts/wsl-start-docker.sh scripts/wsl-migrate.sh scripts/wsl-update.sh

  validate-powershell:
    name: Validate Windows helpers
    runs-on: windows-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: parse PowerShell scripts
        shell: powershell
        run: |
          $files = @('scripts/wsl-update.ps1', 'scripts/test-wsl-integration.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          }

  build:
    name: Build root filesystem (${{ matrix.windows_version }})
    needs: [validate, validate-powershell]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        windows_version: [windows10, windows11]

    env:
      WSL_WINDOWS_VERSION: ${{ matrix.windows_version }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: prepare release identity
        id: release_identity
        run: |
          case "$WSL_WINDOWS_VERSION" in
            windows10) platform=win10x64 ;;
            windows11) platform=win11x64 ;;
            *) echo "unsupported Windows target: $WSL_WINDOWS_VERSION" >&2; exit 2 ;;
          esac
          commit_prefix=$(printf '%s' "$GITHUB_SHA" | cut -c 1-12)
          release_tag="Alpine_$(date -u +%d%m%y)_${platform}_${commit_prefix}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y wget tar

      - name: make scripts executable
        run: |
          chmod +x scripts/build.sh
          chmod +x scripts/setup.sh

      - name: build Alpine rootfs
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
        run: sudo env BUILD_COMMIT="$BUILD_COMMIT" BUILD_RELEASE_TAG="$BUILD_RELEASE_TAG" WSL_WINDOWS_VERSION="$WSL_WINDOWS_VERSION" ./scripts/build.sh

      - name: generate archive checksum
        run: sha256sum alpine-wsl.tar.gz > alpine-wsl.tar.gz.sha256

      - name: upload root filesystem
        uses: actions/upload-artifact@v4
        with:
          name: alpine-wsl-${{ matrix.windows_version }}
          path: |
            alpine-wsl.tar.gz
            alpine-wsl.tar.gz.sha256
          if-no-files-found: error

  inspect:
    name: Inspect build artifact (${{ matrix.windows_version }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        windows_version: [windows10, windows11]

    env:
      WSL_WINDOWS_VERSION: ${{ matrix.windows_version }}

    steps:
      - name: download root filesystem
        uses: actions/download-artifact@v4
        with:
          name: alpine-wsl-${{ matrix.windows_version }}

      - name: read and validate build metadata
        run: |
          tar -tzf alpine-wsl.tar.gz | grep -Fx './usr/local/bin/wsl-migrate'
          tar -tzf alpine-wsl.tar.gz | grep -Fx './usr/local/bin/wsl-update'
          tar -tzf alpine-wsl.tar.gz | grep -Fx './usr/local/lib/wsl-update.ps1'
          tar -xOf alpine-wsl.tar.gz ./etc/alpine-wsl-build > build-info.txt
          grep -Eq '^Alpine version: [0-9]+\.[0-9]+\.[0-9]+$' build-info.txt
          grep -Eq '^Source commit: [0-9a-f]{40}$' build-info.txt
          grep -Fx "Windows target: $WSL_WINDOWS_VERSION" build-info.txt
          release_tag=$(sed -n 's/^Release tag: //p' build-info.txt)
          case "$WSL_WINDOWS_VERSION" in
            windows10) platform=win10x64 ;;
            windows11) platform=win11x64 ;;
          esac
          source_commit=$(sed -n 's/^Source commit: //p' build-info.txt)
          commit_prefix=$(printf '%s' "$source_commit" | cut -c 1-12)
          printf '%s\n' "$release_tag" | grep -Eq "^Alpine_[0-9]{6}_${platform}_${commit_prefix}$"
          tar -xOf alpine-wsl.tar.gz ./etc/wsl.conf > wsl.conf
          if grep -Eq '^[[:space:]]*systemd[[:space:]]*=[[:space:]]*true' wsl.conf; then
            echo "OpenRC builds must not enable systemd" >&2
            exit 1
          fi
          if [ "$WSL_WINDOWS_VERSION" = windows10 ]; then
            if grep -Fx '[boot]' wsl.conf; then
              echo "Windows 10 builds must not contain boot settings" >&2
              exit 1
            fi
          else
            grep -Fx '[boot]' wsl.conf
            grep -Fx 'command=/usr/local/sbin/wsl-start-docker' wsl.conf
          fi
          grep -Eq '^Built at \(UTC\): [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' build-info.txt

  release:
    name: Publish GitHub release (${{ matrix.windows_version }})
    needs: inspect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        windows_version: [windows10, windows11]

    permissions:
      contents: write

    env:
      WSL_WINDOWS_VERSION: ${{ matrix.windows_version }}

    steps:
      - name: download root filesystem
        uses: actions/download-artifact@v4
        with:
          name: alpine-wsl-${{ matrix.windows_version }}

      - name: read release metadata
        id: release_metadata
        run: |
          tar -xOf alpine-wsl.tar.gz ./etc/alpine-wsl-build > build-info.txt
          echo "tag=$(sed -n 's/^Release tag: //p' build-info.txt)" >> "$GITHUB_OUTPUT"
          echo "alpine_version=$(sed -n 's/^Alpine version: //p' build-info.txt)" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(sed -n 's/^Source commit: //p' build-info.txt)" >> "$GITHUB_OUTPUT"
          grep -Fx "Windows target: $WSL_WINDOWS_VERSION" build-info.txt

      - name: check for an existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release_metadata.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for this Alpine version and source commit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_metadata.outputs.tag }}
          body: |
            Alpine version: ${{ steps.release_metadata.outputs.alpine_version }}
            Source commit: ${{ steps.release_metadata.outputs.source_commit }}
            Windows target: ${{ env.WSL_WINDOWS_VERSION }}
          files: |
            alpine-wsl.tar.gz
            alpine-wsl.tar.gz.sha256
