name: build-alpine-wsl

concurrency:
  group: alpine-wsl-build
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_version:
        description: Windows host version
        type: choice
        default: windows10
        options:
          - windows10
          - windows11
  schedule:
    - cron: "0 8 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WSL_WINDOWS_VERSION: ${{ inputs.windows_version || 'windows10' }}

    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget tar shellcheck

      - name: make scripts executable
        run: |
          chmod +x scripts/build.sh
          chmod +x scripts/setup.sh

      - name: validate shell scripts
        run: |
          sh -n scripts/build.sh
          sh -n scripts/setup.sh
          sh -n scripts/wsl-start-docker.sh
          shellcheck scripts/build.sh scripts/setup.sh scripts/wsl-start-docker.sh

      - name: build alpine rootfs
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: sudo env BUILD_COMMIT="$BUILD_COMMIT" WSL_WINDOWS_VERSION="$WSL_WINDOWS_VERSION" ./scripts/build.sh

      - name: read and validate build metadata
        id: metadata
        run: |
          tar -xOf alpine-wsl.tar.gz ./etc/alpine-wsl-build > build-info.txt
          grep -Eq '^Alpine version: [0-9]+\.[0-9]+\.[0-9]+$' build-info.txt
          grep -Eq '^Source commit: [0-9a-f]{40}$' build-info.txt
          grep -Fx "Windows target: $WSL_WINDOWS_VERSION" build-info.txt
          tar -xOf alpine-wsl.tar.gz ./etc/wsl.conf > wsl.conf
          if grep -Eq '^[[:space:]]*systemd[[:space:]]*=[[:space:]]*true' wsl.conf; then
            echo "OpenRC builds must not enable systemd" >&2
            exit 1
          fi
          if [ "$WSL_WINDOWS_VERSION" = windows10 ]; then
            if grep -Fx '[boot]' wsl.conf; then
              echo "Windows 10 builds must not contain boot settings" >&2
              exit 1
            fi
          else
            grep -Fx '[boot]' wsl.conf
            grep -Fx 'command=/usr/local/sbin/wsl-start-docker' wsl.conf
          fi
          grep -Eq '^Built at \(UTC\): [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' build-info.txt
          alpine_version=$(sed -n 's/^Alpine version: //p' build-info.txt)
          echo "alpine_version=$alpine_version" >> "$GITHUB_OUTPUT"
          echo "tag=alpine-v${alpine_version}-${GITHUB_SHA::8}-${WSL_WINDOWS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-wsl
          path: alpine-wsl.tar.gz

      - name: check for an existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.metadata.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for this Alpine version and source commit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: create github release
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Alpine WSL ${{ steps.metadata.outputs.tag }}
          body: |
            Alpine version: ${{ steps.metadata.outputs.alpine_version }}
            Source commit: ${{ github.sha }}
            Windows target: ${{ env.WSL_WINDOWS_VERSION }}
          files: alpine-wsl.tar.gz
